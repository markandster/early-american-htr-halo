[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "early-american-htr-halo"
version = "0.1.0"
description = "Verifiable archival rewards, corpus hygiene, and Halo SFT/VLM SMPO post-training recipes for 18th-century diplomatic handwriting VLMs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mark Sternberg"},
]
dependencies = [
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
