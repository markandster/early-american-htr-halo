name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v

      - name: Validate Halo YAML templates and Colab notebook syntax
        run: |
          python - <<'PY'
          import ast, glob, json, yaml
          from pathlib import Path

          for f in sorted(glob.glob("configs/halo/*.yaml")):
              with open(f, "r", encoding="utf-8") as fh:
                  data = yaml.safe_load(fh)
              assert isinstance(data, dict) and data, f"Invalid YAML: {f}"
              print(f"YAML OK: {f}")

          nb = json.loads(Path("notebooks/colab_competition_pretrain_sft.ipynb").read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4
          for idx, cell in enumerate(nb["cells"]):
              if cell["cell_type"] == "code":
                  lines = [ln for ln in cell["source"] if not ln.lstrip().startswith("!")]
                  ast.parse("".join(lines), filename=f"cell_{idx}.py")
          print(f"Notebook OK: {len(nb['cells'])} cells parsed cleanly")
          PY
