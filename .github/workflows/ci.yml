name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pillow datasets

      - name: Run unit tests
        run: pytest -v

      - name: Validate Halo YAML configs and notebook syntax
        run: |
          python scripts/validate_halo_configs.py
          python - <<'PY'
          import ast, glob, json
          from pathlib import Path

          for nb_file in sorted(glob.glob("notebooks/*.ipynb")):
              if Path(nb_file).name.startswith("._"):
                  continue
              nb = json.loads(Path(nb_file).read_text(encoding="utf-8"))
              assert nb["nbformat"] == 4
              for idx, cell in enumerate(nb["cells"]):
                  if cell["cell_type"] == "code":
                      lines = [ln for ln in cell["source"] if not ln.lstrip().startswith("!")]
                      ast.parse("".join(lines), filename=f"{nb_file}:cell_{idx}.py")
              print(f"Notebook OK: {nb_file} ({len(nb['cells'])} cells)")
          PY
