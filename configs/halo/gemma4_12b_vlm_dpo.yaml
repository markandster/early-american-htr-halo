# Halo VLM DPO (Secondary Stage 2 Ablation) — Gemma-4 12B-IT.
# Uses PEFT implicit adapter-disabled reference (DataCollatorForVisionPreference).
# Launch from repo root: torchrun --nproc_per_node=1 /path/to/halo/scripts/training/preference/dpo.py configs/halo/gemma4_12b_vlm_dpo.yaml

# --- Model (merged Stage 1 SFT HF directory) ---
model_name_or_path: checkpoints/gemma4-12b-eahtr-sft-merged
attn_implementation: sdpa
bf16: true

# --- Dataset (Arrow save_to_disk dir with images + prompt/chosen/rejected) ---
dataset:
  - data/halo_vlm_smpo
images_field: images

# --- DPO objective ---
loss_type:
  - sigmoid
  - sft
beta: 0.1
max_length: 4096

# --- Tokens & chat template ---
chat_template: configs/halo/templates/gemma4_htr_nothink.jinja
force_chat_template: true
pad_token: <pad>

# --- PEFT ---
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: all-linear

# --- Training ---
num_train_epochs: 1.0
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_steps: 0.05
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# --- Checkpointing & logging ---
output_dir: checkpoints/gemma4-12b-eahtr-dpo
eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 2
save_only_model: true
logging_steps: 1
logging_first_step: true
remove_unused_columns: false
dataloader_num_workers: 2
