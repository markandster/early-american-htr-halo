# Halo Text-Only Contingency: Offline GRPO — Gemma-4 12B post-correction on pre-scored rollouts.
# Note: Halo Offline GRPO refuses image columns; use configs/halo/gemma4_*_vlm_smpo.yaml for Stage 2 VLM training.
# Input rows: {"prompt": ..., "completions": [...], "rewards": [...]} emitted by eahtr.rewards.score_jsonl_file.
# Launch: torchrun --nproc_per_node=4 /path/to/halo/scripts/training/grpo/offline.py configs/halo/archival_grpo_offline.yaml

# --- Model ---
model_name_or_path: checkpoints/gemma4-12b-eahtr-sft
attn_implementation: sdpa
moe_balancing: none
bf16: true

# --- Dataset ---
dataset:
  - data/scored_offline_grpo_rollouts.jsonl

# --- Offline GRPO hyperparameters ---
loss_type: bnpo
initial_min_log_prob: -0.5

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
num_train_epochs: 1.0
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
learning_rate: 5.0e-6
weight_decay: 0.01
lr_scheduler_type: cosine
warmup_steps: 10

# --- Sequence lengths ---
max_prompt_length: 2048
max_completion_length: 2048

# --- Checkpointing & logging ---
output_dir: checkpoints/archival-grpo-offline
save_steps: 50
eval_strategy: steps
eval_steps: 50
save_total_limit: 2
save_only_model: true
logging_steps: 1
logging_first_step: true
num_eval_examples: 10
dataloader_num_workers: 2
remove_unused_columns: false
dataloader_drop_last: true

# --- PEFT ---
use_peft: false
