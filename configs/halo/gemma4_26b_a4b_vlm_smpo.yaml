# Halo VLM SMPO — Gemma-4 26B-A4B-IT (MoE EP=8 Stage 2 Verifiable Preference Optimization).
# Reference-model-free SMPO over deterministic preference pairs scored by eahtr.rewards.
# Note: FORWARD_ROWS_PER_EXAMPLE (2) * max_length (4096) = 8192 <= HALO_DEEPEP_GIN_MAX_TOKENS_PER_RANK.
# Launch from repo root: torchrun --nproc_per_node=8 /path/to/halo/scripts/training/preference/smpo.py configs/halo/gemma4_26b_a4b_vlm_smpo.yaml

# --- Model ---
model_name_or_path: checkpoints/gemma4-26b-a4b-eahtr-sft
attn_implementation: sdpa
moe_balancing: none
bf16: true

# --- Parallelism & MoE precision ---
expert_parallel_size: 8
fp32_experts: true

# --- Dataset (Arrow save_to_disk dir with Sequence(Image()) and continuation-only chosen/rejected) ---
dataset:
  - data/halo_vlm_smpo

# --- SMPO objective & margin schedule ---
loss_type: smooth_lower_bound
chosen_sft_ratio: 0.75
beta: 1.0
use_margin_schedule: true
initial_margin: 0.2
target_margin: 0.4
lower_clip_percentile: 0.02
min_log_prob: -2.3

# --- Sequence budgets ---
padding_free: false
max_prompt_length: 1600
max_length: 4096

# --- Tokens & chat template ---
chat_template: configs/halo/templates/gemma4_htr_nothink.jinja
force_chat_template: true
pad_token: <pad>

# --- PEFT ---
# Explicit attention + grouped expert projections (never all-linear under EP).
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_up_proj
  - down_proj

# --- Training ---
num_train_epochs: 1.0
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-6
lr_scheduler_type: cosine
warmup_steps: 0.05
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# --- Checkpointing & logging ---
output_dir: checkpoints/gemma4-26b-a4b-eahtr-smpo
eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 2
save_only_model: true
logging_steps: 1
logging_first_step: true
remove_unused_columns: false
dataloader_num_workers: 2
