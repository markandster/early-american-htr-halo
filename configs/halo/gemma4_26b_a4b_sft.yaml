# Halo VLM SFT — Gemma-4 26B-A4B-IT MoE (EP=8 full-parameter SFT with fp32_experts).
# Pinned HF rev: 4d7ae4984b7db7de8f8457170b3f1a419ee76d52 (128 experts, top-8).
# Storage note: fp32_experts saves ~97 GB per checkpoint-N without a final save_model export;
# budget ~300 GB disk and convert via `convert_to_bf16.py --verify` before Stage 2 or eval.
# Launch via scripts/run_gemma4_halo.sh MODEL_SIZE=26b_a4b (torchrun --nproc_per_node=8).

# --- Model ---
model_name_or_path: google/gemma-4-26B-A4B-it
moe_balancing: none
attn_implementation: sdpa
bf16: true

# --- Parallelism & MoE precision ---
expert_parallel_size: 8
fp32_experts: true

# --- Dataset (CC-BY-4.0 / Public Domain save_to_disk Arrow dataset or HF Hub repo) ---
dataset:
  - data/halo_vlm_sft
conversation_field: messages
images_field: images

# --- Sequence budget & VLM constraints ---
packing: false
max_length: 4096

# --- Tokens & chat template ---
train_on_completions_only: true
chat_template: configs/halo/templates/gemma4_htr_nothink.jinja
force_chat_template: true
assistant_message_template: "<|turn>model\n<|channel>thought\n<channel|>"
pad_token: <pad>

# --- Full-parameter MoE SFT ---
use_peft: false

# --- Training ---
num_train_epochs: 1.5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_steps: 0.05
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# --- Checkpointing & logging ---
output_dir: checkpoints/gemma4-26b-a4b-eahtr-sft
eval_strategy: steps
eval_steps: 50
save_steps: 100
save_total_limit: 1
save_only_model: true
logging_steps: 1
logging_first_step: true
log_decoded_samples: true
remove_unused_columns: false
dataloader_num_workers: 2
