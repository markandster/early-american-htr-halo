# Halo VLM SFT — Gemma-4 12B-IT on rights-cleared 18th-century diplomatic HTR.
# Aligned with whitecircle/halo (agent-docs/models/gemma4.md & agent-docs/training-methods/sft.md).
# Launch: halo launch sft configs/halo/gemma4_12b_sft.yaml --nproc 1

# --- Model ---
model_name_or_path: google/gemma-4-12B-it
attn_implementation: sdpa  # required for Gemma-4 global_head_dim=512 (FlashAttention rejects it)

# --- Dataset (CC-BY-4.0 / Public Domain only; resize images during prep — Halo refuses max_pixels on non-Qwen) ---
dataset:
  - data/public_train.jsonl
conversation_field: messages
images_field: images
test_size: 0.05

# --- Sequence budget & VLM constraints ---
packing: false  # VLM image runs refuse packing and padding_free
max_length: 8192

# --- Tokens & chat template ---
train_on_completions_only: true
assistant_message_template: "<|turn>model\n"
pad_token: <pad>

# --- PEFT ---
# Gemma-4 vision projections use Gemma4ClippableLinear; all-linear resolves into inner nn.Linear
# so both the vision tower and language decoder adapt cleanly.
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: all-linear

# --- Training ---
num_train_epochs: 1.5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_steps: 0.05
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# --- Checkpointing & logging ---
output_dir: checkpoints/gemma4-12b-eahtr-sft
eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 2
save_only_model: true
logging_steps: 1
logging_first_step: true
remove_unused_columns: false
dataloader_num_workers: 2
