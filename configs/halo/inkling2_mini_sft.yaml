# Template aligned with Halo docs; verify exact keys against Dec 1 Track Rules and Halo release commit.
model_name_or_path: thinkingmachines/Inkling-2-Mini
license: Apache-2.0
task_type: vlm_sft

# Dataset (CC-BY-4.0 / Public Domain only)
dataset_path: data/public_train.jsonl
val_dataset_path: data/public_val.jsonl
max_pixels: 4194304 # 2048 x 2048
assistant_only_loss: true

# Looped MoE VLM adaptation
expert_parallel_size: 8
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

num_train_epochs: 1.5
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.5e-5
bf16: true
gradient_checkpointing: true
output_dir: runs/inkling2_mini_sft
