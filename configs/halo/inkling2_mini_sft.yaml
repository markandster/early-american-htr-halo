# Halo VLM SFT — Inkling-2-Mini (26.4B / 5.4B active, Apache-2.0) on public diplomatic HTR.
# Blocked pending upstream whitecircle/halo support for model_type `inkling2_loop` / BF16 release.
# Retained as an alignment reference; active Track 2 Primary is configs/halo/inkling2_small_sft.yaml.

# --- Model ---
model_name_or_path: thinkingmachines/Inkling-2-Mini
moe_balancing: none
pad_token: "<|endoftext|>"
bf16: true

# --- Parallelism ---
expert_parallel_size: 2

# --- Dataset (CC-BY-4.0 / Public Domain save_to_disk Arrow dataset or HF Hub repo) ---
dataset:
  - data/halo_vlm_sft
conversation_field: messages
images_field: images

# --- Sequence budget & VLM constraints ---
packing: false
max_length: 4096

# --- Tokens & chat template ---
train_on_completions_only: true
chat_template: configs/halo/templates/inkling2_htr_nothink.jinja
force_chat_template: true
assistant_message_template: "<|message_model|><|content_text|>"

# --- PEFT ---
# Inkling 2 attention includes r_proj (learned relative-logits bias) alongside q/k/v/o.
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - r_proj
  - o_proj

# --- Training ---
num_train_epochs: 1.5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_steps: 0.05
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true

# --- Checkpointing & logging ---
output_dir: checkpoints/inkling2-mini-eahtr-sft
eval_strategy: steps
eval_steps: 100
save_steps: 100
save_total_limit: 2
save_only_model: true
logging_steps: 1
logging_first_step: true
log_decoded_samples: true
remove_unused_columns: false
dataloader_num_workers: 2
