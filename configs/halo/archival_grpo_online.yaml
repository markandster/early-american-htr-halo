# Halo Text-Only Contingency: Online GRPO — Gemma-4 12B / 26B-A4B text-only RLVR template.
# Note: Halo Online GRPO refuses image columns; use configs/halo/gemma4_*_vlm_smpo.yaml for Stage 2 VLM training.
# Rewards use Halo's built-in RLVR source schema as a text-only post-correction contingency placeholder;
# pre-scored diplomatic archival rewards from eahtr.rewards feed archival_grpo_offline.yaml or *_vlm_smpo.yaml.
# Launch from repo root: start vLLM server with --weight-transfer-config '{"backend": "nccl"}', then
#   torchrun --nproc_per_node=4 /path/to/halo/scripts/training/grpo/online.py configs/halo/archival_grpo_online.yaml

# --- Model ---
model_name_or_path: checkpoints/gemma4-12b-eahtr-sft
attn_implementation: sdpa
moe_balancing: none
bf16: true

# --- Dataset ---
dataset:
  - data/public_grpo_prompts.jsonl
prompt_field: prompt
answer_field: reference

# --- Built-in Halo RLVR reward placeholder (contingency) ---
rewards:
  - source: accuracy
    name: archival_diplomatic_verifier
    weight: 1.0

# --- GRPO hyperparameters ---
beta: 0.0
num_iterations: 1
epsilon: 0.15
scale_rewards: group
num_generations: 8
temperature: 1.0
loss_type: grpo
use_chunked_grpo_logprobs: true  # Gemma-4 262k vocab

# --- Training ---
per_device_train_batch_size: 2
num_train_epochs: 1.0
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_steps: 20

# --- Sequence lengths ---
max_prompt_length: 2048
max_completion_length: 2048

# --- vLLM generation ---
use_vllm: true
vllm_mode: server

# --- Checkpointing & logging ---
output_dir: checkpoints/archival-grpo-online
save_steps: 50
eval_strategy: steps
eval_steps: 50
save_total_limit: 3
save_only_model: true
logging_steps: 1
logging_first_step: true
log_completions: true

# --- PEFT ---
use_peft: false
