# Halo Online GRPO — Gemma-4 12B / 26B-A4B with deterministic archival verifier rewards.
# Aligned with whitecircle/halo/examples/grpo/online/rlvr-online-grpo-template.yaml.
# Note: For Inkling 2 use configs/halo/inkling2_offline_grpo.yaml (online GRPO is refused on Inkling 2).
# Launch: start vLLM server with --weight-transfer-config '{"backend": "nccl"}', then
#   torchrun --nproc_per_node=4 scripts/training/grpo/online.py configs/halo/archival_grpo_online.yaml

# --- Model ---
model_name_or_path: checkpoints/gemma4-12b-eahtr-sft
attn_implementation: sdpa
moe_balancing: none

# --- Dataset ---
dataset: data/public_grpo_prompts.jsonl
test_size: 0.05
prompt_field: prompt
answer_field: reference

# --- Deterministic archival verifier rewards (matched to eahtr.rewards.ArchivalRewardConfig) ---
rewards:
  - source: eahtr.rewards
    name: archival_diplomatic_verifier
    weight: 1.0
    params:
      cer_weight: 0.6
      wer_weight: 0.4
      modernization_penalty: 0.05
      format_penalty: 0.10
      truncation_penalty: 0.25
      loop_floor: -1.0

# --- GRPO hyperparameters ---
beta: 0.0
num_iterations: 1
epsilon: 0.15
scale_rewards: group
num_generations: 8
temperature: 1.0
loss_type: grpo
use_chunked_grpo_logprobs: true  # Gemma-4 262k vocab

# --- Training ---
per_device_train_batch_size: 2
num_train_epochs: 1.0
gradient_accumulation_steps: 8
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_steps: 20

# --- Sequence lengths ---
max_prompt_length: 2048
max_completion_length: 2048

# --- vLLM generation ---
use_vllm: true
vllm_mode: server

# --- Checkpointing & logging ---
output_dir: checkpoints/archival-grpo-online
save_steps: 50
eval_strategy: steps
eval_steps: 50
save_total_limit: 3
save_only_model: true
logging_steps: 1
logging_first_step: true
log_completions: true

# --- PEFT ---
use_peft: false
